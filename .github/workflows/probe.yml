name: Probe (temporary)
on:
  push:
    branches: [probe-lcw]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r collector/requirements.txt
      - run: |
          python - <<'PY'
          import sys, json, requests; sys.path.insert(0, "collector")
          import platforms
          t = requests.get("https://www.lcwaikiki.ma/fr/mvc/women-sales", headers={"User-Agent": platforms.UA}, timeout=40).text
          m = platforms.lcw_model(t)
          items = m["CatalogList"]["Items"]
          print("PageInfo", m.get("PageInfo"))
          keys = ["ProductDescription","PriceValue","DiscountedPriceValue","Price","DiscountedPrice","OldPrice","MinOldPrice","MinCurrentPrice","MaxCurrentPrice","LowestPriceInLastMonth","Discounted","CurrentPricesAreDiscounted","DiscountRatio","AnchorPrice"]
          for p in items[:4]:
              print(json.dumps({k: p.get(k) for k in keys}, ensure_ascii=False))
              print("  badges:", json.dumps(p.get("CampaignBadges"), ensure_ascii=False)[:600])
          diff = [p for p in items if p.get("OldPrice") != p.get("Price")]
          print("OldPrice != Price:", len(diff), "/", len(items))
          PY
