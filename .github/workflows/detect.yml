name: Detect a shop's platform

# Actions → "Detect a shop's platform" → Run workflow, then type the domains (e.g. "kiabi.ma lacoste.ma").
# Tells whether the collector can read each shop from a server, and with which reader.
on:
  workflow_dispatch:
    inputs:
      domains:
        description: 'Domains, separated by spaces'
        required: true

permissions:
  contents: read

jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r collector/requirements.txt
      - run: python collector/collect.py --detect ${{ inputs.domains }}
