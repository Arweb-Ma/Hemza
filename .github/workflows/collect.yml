name: Collect prices

# Big brands every two hours, small shops once a day; each run then rebuilds the site.
# Needs the SUPABASE_SERVICE_KEY repository secret (Supabase → Project settings → API keys →
# service_role / secret key). TELEGRAM_BOT_TOKEN and TELEGRAM_CHANNEL secrets enable posting.
on:
  schedule:
    - cron: '5 */2 * * *'    # brands
    - cron: '35 3 * * *'     # small shops
  workflow_dispatch:
    inputs:
      tier:
        description: 'Which stores to collect'
        type: choice
        options: [marque, boutique]
        default: marque

concurrency:
  group: collect
  cancel-in-progress: false

permissions:
  contents: read
  actions: write          # to start the "Deploy site" workflow afterwards

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      SUPABASE_URL: https://tcsjfqkreqceektalogu.supabase.co
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
      TIER: ${{ inputs.tier || (github.event.schedule == '35 3 * * *' && 'boutique') || 'marque' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: collector/requirements.txt
      - run: pip install -r collector/requirements.txt
      # Decathlon.ma is read with a headless Chromium (collector/browser.py); only the brands need it.
      - name: Install the browser reader
        if: ${{ env.TIER == 'marque' }}
        run: |
          pip install -r collector/requirements-browser.txt
          python -m playwright install --with-deps chromium
      - name: Collect (${{ env.TIER }}) and post
        run: python collector/run.py --tier "$TIER" --max-minutes 45
      - name: Rebuild the site with the new prices
        if: ${{ always() && env.SUPABASE_SERVICE_KEY != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY" --ref main
